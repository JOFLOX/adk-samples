[project]
name = "graphrag-multi-agent"
version = "0.1.0"
description = "Multi-agent GraphRAG system that answers investment-research questions over a Neo4j knowledge graph using Text-to-Cypher, a custom investor tool, and optional MCP Toolbox queries."
readme = "README.md"
license = { text = "Apache License 2.0" }
requires-python = ">=3.11"

dependencies = [
    "google-adk[gcp,mcp,otel-gcp]>=2.6.0,<3.0.0",
    "neo4j>=6.0.3",
    "python-dotenv>=1.0.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "gcsfs>=2024.11.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "google-cloud-aiplatform[agent-engines]>=1.156.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.7",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true
